[workspace]
name = "onnxruntime"
description = "onnxruntime"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"]

[feature.test.dependencies]
setuptools = ">=75.6.0"
numpy = "*"
pip = "*"
sympy = "*"
pytest = ">=8.4.2,<10"
onnx = "*"
parameterized = ">=0.9.0,<0.10"
mpi4py = ">=4.1.1,<5"
onnx-ir = ">=1.1.0,<2"
python-flatbuffers = ">=25.12.19,<26"

[feature.build.dependencies]
cmake = ">=3.30.2"
make = "*"
ninja = "*"
numpy = "*"
pip = "*"
libdate = ">=3.0.1,<4"
c-compiler = ">=1.8.0,<2"
cxx-compiler = ">=1.8.0,<2"
# libprotobuf = "3.21.*"
packaging = ">=24.1,<25"
setuptools = ">=75.6.0"
clang-tools = "*"
nanobind = ">=3.1.0,<4"

[feature.lint.dependencies]
# versions are based on requirements-lintrunner.txt
clang-format = "==20.1.8"
ruff = "==0.12.12"
pip = ">=26.2.2,<27"
[feature.lint.pypi-dependencies]
lintrunner = ">=0.12.5"
lintrunner-adapters = ">=0.12.4"
[feature.lint.tasks]
lintrunner-init = "lintrunner init"
lintrunner-run = "lintrunner --all-files"

[feature.py311.dependencies]
python-gil = "3.11.*"
[feature.py312.dependencies]
python-gil = "3.12.*"
[feature.py313.dependencies]
python-gil = "3.13.*"
[feature.py314.dependencies]
python-gil = "3.14.*"

[feature.build.tasks.build]
env = { CMAKE_EXPORT_COMPILE_COMMANDS = "1", CMAKE_CXX_STANDARD = "17" }
args = [
  { "arg" = "src_dir", "default" = "." },
  { "arg" = "config", "default" = "Debug" },
]
cmd = 'python {{ src_dir }}/tools/ci_build/build.py --update --build_wheel --enable_pybind --build_shared_lib --build_dir build --config {{ config }} --build --parallel --compile_no_warning_as_error --skip_pip_install {% if pixi.is_win %} --disable_memleak_checker {% endif %} --no_telemetry'

[feature.build.tasks.ctest]
args = [
  { "arg" = "config", "default" = "Debug" },
]
cmd = "ctest -V -C {{ config }} --test-dir build/{{ config }}/"

[feature.build.tasks.build-nb]
args = [
  { "arg" = "config", "default" = "Debug" },
]
cmd = "cmake -S onnxruntime/python_nb -B build/nb -G Ninja -DCMAKE_BUILD_TYPE={{ config }} -DONNXRUNTIME_LIB_DIR=build/{{ config }} && cmake --build build/nb"

[feature.test.tasks.test-nb]
# run from build/nb so that the source tree's onnxruntime directory does not shadow the installed package
cwd = "build/nb"
cmd = "python -m pytest -q -p no:cacheprovider ../../onnxruntime/python_nb"

[tasks.install]
args = [
  { "arg" = "config", "default" = "Debug" },
]
# windows has config twice in the path
cmd = 'python -m pip install build/{{ config }}/{% if pixi.is_win  %}{{ config }}/{% endif %}dist/onnxruntime*.whl --no-deps --no-build-isolation --force-reinstall'

[environments]
default = ["test", "py313"]

run311 = ["build", "test", "py311"]
build311 = ["build", "py311"]
run312 = ["build", "test", "py312"]
build312 = ["build", "py312"]
run313 = ["build", "test", "py313"]
build313 = ["build", "py313"]
run314 = ["build", "test", "py314"]
build314 = ["build", "py314"]

[environments.lint]
features = ["lint"]
